name: SonarCloud

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    name: Build and analyze
    runs-on: ubuntu-latest

    steps:
      # -------------------------
      # Checkout code
      # -------------------------
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # -------------------------
      # Setup .NET
      # -------------------------
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 8.0.x

      # -------------------------
      # Setup Node.js
      # -------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      # -------------------------
      # Install SonarCloud scanner
      # -------------------------
      - name: Install SonarCloud scanner
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Add dotnet tools to PATH
        run: echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      # -------------------------
      # Begin SonarCloud analysis
      # -------------------------
      - name: SonarCloud Begin
        run: |
          dotnet sonarscanner begin \
            /k:"hasan4601756_Task-Management-Tool" \
            /o:"hasan4601756" \
            /d:sonar.login="${{ secrets.SONAR_TOKEN }}" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.cs.vscoveragexml.reportsPaths="**/TestResults/*/coverage.cobertura.xml"

      # -------------------------
      # Restore .NET dependencies
      # -------------------------
      - name: Restore .NET dependencies
        run: dotnet restore backend/TaskManagementTool.sln

      # -------------------------
      # Build .NET
      # -------------------------
      - name: Build .NET
        run: dotnet build backend/TaskManagementTool.sln --no-restore

      # -------------------------
      # Run .NET Tests with coverage
      # -------------------------
      - name: Test .NET with coverage
        run: dotnet test backend/TaskManagementTool.sln --no-build --collect:"XPlat Code Coverage"

      # -------------------------
      # Build React App
      # -------------------------
      - name: Install React dependencies
        run: |
          cd frontend
          npm install

      - name: Build React
        run: |
          cd frontend
          npm run build

      - name: Run React Tests
        run: |
          cd frontend
          npm test -- --coverage --watchAll=false

      # -------------------------
      # End SonarCloud analysis
      # -------------------------
      - name: SonarCloud End
        run: dotnet sonarscanner end /d:sonar.login="${{ secrets.SONAR_TOKEN }}"
